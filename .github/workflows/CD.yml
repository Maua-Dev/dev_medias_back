name: CD

on:
  push:
    branches:
      - dev
      - homolog
      - prod

  workflow_dispatch:

jobs:
  DeployToAWS:
    environment:
        name: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
        - name: Checkout repository
          uses: actions/checkout@v4 

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.12'

        - name: Set AWS Account ID
          run: |
            if [[ "${{ github.ref_name }}" == "dev" ]]; then
              echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_DEV }}" >> $GITHUB_ENV
            elif [[ "${{ github.ref_name }}" == "homolog" ]]; then
              echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_HOMOLOG }}" >> $GITHUB_ENV
            elif [[ "${{ github.ref_name }}" == "prod" ]]; then
              echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_PROD }}" >> $GITHUB_ENV
            else
              echo "Invalid branch name!" && exit 1
            fi

        - name: Setting stage and stack name
          run: |
            echo "STAGE=${{ github.ref_name }}" 
            if [[ "${{ github.ref_name }}" == "prod" ]]; then
              echo "STAGE=prod" >> $GITHUB_ENV
            elif [[ "${{ github.ref_name }}" == "homolog" ]]; then
              echo "STAGE=homolog" >> $GITHUB_ENV
            elif [[ "${{ github.ref_name }}" == "dev" ]]; then
              echo "STAGE=dev" >> $GITHUB_ENV
            elif [[ "${{ github.ref_name }}" == "fix/githubActions" ]]; then
              echo "STAGE=dev" >> $GITHUB_ENV
            else
              echo "Invalid branch name!" && exit 1
            fi
            echo "STACK_NAME=DevMediasStack${{github.ref_name}}" >> $GITHUB_ENV

        - name: Setup AWS Credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-region: ${{ vars.AWS_REGION }}
            role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GithubActionsRole
            role-session-name: github-action

        - name: Configure pip caching
          uses: actions/cache@v4
          with:
            path: ~/.cache/pip
            key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
            restore-keys: |
              ${{ runner.os }}-pip-

        - name: Build Lambda Layer using Docker
          run: |
            echo "Building Lambda Layer in a Lambda-compatible environment..."
            # Cria um Dockerfile na hora para construir a layer
            cat <<EOF > Dockerfile
            FROM public.ecr.aws/lambda/python:3.9
            WORKDIR /app
            COPY requirements-layer.txt .
            RUN mkdir -p build/python
            RUN pip install -r requirements-layer.txt -t build/python --no-cache-dir
            EOF
            
            # Executa o build, copia a pasta 'build' para fora do container
            docker build -t lambda-layer-builder .
            docker create --name temp_builder lambda-layer-builder
            docker cp temp_builder:/app/build ./iac/build
            docker rm temp_builder
            echo "Lambda Layer artifacts created in ./iac/build"

        - name: Installing Dependencies
          run: |
            npm install -g aws-cdk
            cd iac
            pip install -r requirements.txt
                 
        - name: DeployWithCDK
          run: |
            cd iac
            cdk synth
            cdk deploy --require-approval never
          env:
            AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
            AWS_REGION: ${{ vars.AWS_REGION }}
            STACK_NAME: ${{ env.STACK_NAME }}
            GITHUB_REF_NAME: ${{ github.ref_name }}
            FROM_EMAIL: ${{ vars.FROM_EMAIL }}  
            HIDDEN_COPY: ${{ vars.HIDDEN_COPY }}
            REPLY_TO_EMAIL: ${{ vars.REPLY_TO_EMAIL }}  
