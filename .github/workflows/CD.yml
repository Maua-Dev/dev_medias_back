name: CD

on:
  push:
    branches:
      - dev
      - homolog
      - prod

  workflow_dispatch:

jobs:
  DeployToAWS:
    environment:
        name: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
        - name: Checkout repository
          uses: actions/checkout@v4 

        - name: Setup Python 3.13
          uses: actions/setup-python@v5
          with:
            python-version: '3.13'

        - name: Set AWS Account ID and other variables
          id: cfg
          run: |
            if [[ "${{ github.ref_name }}" == "dev" ]]; then
              ACCOUNT="${{ secrets.AWS_ACCOUNT_ID_DEV }}"
            elif [[ "${{ github.ref_name }}" == "homolog" ]]; then
              ACCOUNT="${{ secrets.AWS_ACCOUNT_ID_HOML }}"
            elif [[ "${{ github.ref_name }}" == "prod" ]]; then
              # Same account as legacy DevMediasStackprod / iOS CDN
              ACCOUNT="891377229275"
            else
              echo "Invalid branch name!" && exit 1
            fi
            STACK_NAME="DevMediasStackV2${{ github.ref_name }}"
            {
              echo "AWS_ACCOUNT_ID=$ACCOUNT"
              echo "STACK_NAME=$STACK_NAME"
              echo "STACK_GENERATION=v2"
            } >> "$GITHUB_ENV"
            {
              echo "aws_account_id=$ACCOUNT"
              echo "stack_name=$STACK_NAME"
              echo "stack_generation=v2"
            } >> "$GITHUB_OUTPUT"

        - name: Setup AWS Credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-region: ${{ vars.AWS_REGION }}
            # Step output (not env context) — env context can lag GITHUB_ENV
            role-to-assume: arn:aws:iam::${{ steps.cfg.outputs.aws_account_id }}:role/GithubActionsRole
            role-session-name: github-action

        - name: Installing Dependencies
          run: |
            npm install -g aws-cdk
            cd iac
            pip install -r requirements-infra.txt

        - name: DeployWithCDK
          run: |
            set -euo pipefail
            cd iac
            CALLER=$(aws sts get-caller-identity --query Account --output text)
            echo "Deploying STACK_NAME=$STACK_NAME generation=$STACK_GENERATION"
            echo "Configured account=$AWS_ACCOUNT_ID caller_identity=$CALLER"
            if [[ "$CALLER" != "$AWS_ACCOUNT_ID" ]]; then
              echo "::error::STS caller $CALLER != configured AWS_ACCOUNT_ID $AWS_ACCOUNT_ID"
              exit 1
            fi
            cdk synth
            cdk deploy --require-approval never
          env:
            AWS_ACCOUNT_ID: ${{ steps.cfg.outputs.aws_account_id }}
            AWS_REGION: ${{ vars.AWS_REGION }}
            STACK_NAME: ${{ steps.cfg.outputs.stack_name }}
            STACK_GENERATION: ${{ steps.cfg.outputs.stack_generation }}
            GITHUB_REF_NAME: ${{ github.ref_name }}
            FROM_EMAIL: ${{ vars.FROM_EMAIL }}  
            HIDDEN_COPY: ${{ vars.HIDDEN_COPY }}
            REPLY_TO_EMAIL: ${{ vars.REPLY_TO_EMAIL }}
