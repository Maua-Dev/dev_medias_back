name: CD

on:
  push:
    branches:
      - dev
      - homolog
      - prod

  workflow_dispatch:

jobs:
  DeployToAWS:
    environment:
        name: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
        - name: Checkout repository
          uses: actions/checkout@v4 

        - name: Setup Python 3.13
          uses: actions/setup-python@v5
          with:
            python-version: '3.13'

        - name: Set AWS Account ID and other variables
          run: |
            # Prefer environment-scoped AWS_ACCOUNT_ID (historical prod CD target).
            # Fall back to stage-specific repo secrets for environments that only have those.
            if [[ -n "${{ secrets.AWS_ACCOUNT_ID }}" ]]; then
              echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV
            elif [[ "${{ github.ref_name }}" == "dev" ]]; then
              echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_DEV }}" >> $GITHUB_ENV
            elif [[ "${{ github.ref_name }}" == "homolog" ]]; then
              echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_HOML }}" >> $GITHUB_ENV
            elif [[ "${{ github.ref_name }}" == "prod" ]]; then
              echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_PROD }}" >> $GITHUB_ENV
            else
              echo "Invalid branch name!" && exit 1
            fi
            # V2 parallel stack — never target DevMediasStackprod (iOS CDN legacy)
            echo "STACK_NAME=DevMediasStackV2${{github.ref_name}}" >> $GITHUB_ENV
            echo "STACK_GENERATION=v2" >> $GITHUB_ENV

        - name: Setup AWS Credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-region: ${{ vars.AWS_REGION }}
            role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GithubActionsRole
            role-session-name: github-action

        - name: Installing Dependencies
          run: |
            npm install -g aws-cdk
            cd iac
            pip install -r requirements-infra.txt

        - name: DeployWithCDK
          run: |
            cd iac
            cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ vars.AWS_REGION }}
            cdk synth
            cdk deploy --require-approval never
          env:
            AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
            AWS_REGION: ${{ vars.AWS_REGION }}
            STACK_NAME: ${{ env.STACK_NAME }}
            STACK_GENERATION: ${{ env.STACK_GENERATION }}
            GITHUB_REF_NAME: ${{ github.ref_name }}
            FROM_EMAIL: ${{ vars.FROM_EMAIL }}  
            HIDDEN_COPY: ${{ vars.HIDDEN_COPY }}
            REPLY_TO_EMAIL: ${{ vars.REPLY_TO_EMAIL }}
